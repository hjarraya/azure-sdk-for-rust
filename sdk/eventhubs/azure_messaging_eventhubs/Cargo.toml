[package]
name = "azure_messaging_eventhubs"
version = "0.11.0"
description = "Rust client for Azure Eventhubs Service"
readme = "README.md"
authors = ["Microsoft"]
license = "MIT"
repository = "https://github.com/azure/azure-sdk-for-rust"
homepage = "https://github.com/azure/azure-sdk-for-rust"
documentation = "https://docs.rs/azure_messaging_eventhubs"
keywords = ["sdk", "azure", "messaging", "cloud", "eventhubs"]
categories = ["api-bindings"]

edition = "2024"

[dependencies]
async-lock = "3.0"
async-stream = "0.3.5"
async-trait = "0.1"
azure_core = { version = "0.32.0", default-features = false }
azure_core_amqp = "0.11.0"
futures = "0.3"
rand = "0.9.1"
rand_chacha = "0.9"
tracing = "0.1.40"

[build-dependencies]
rustc_version = "0.4"

[features]
in_memory_checkpoint_store = []
default = ["azure_core_amqp/default"]

[[bench]]
name = "benchmarks"
harness = false
